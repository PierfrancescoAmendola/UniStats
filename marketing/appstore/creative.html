<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>UniStats creative asset</title>
<style>
@font-face { font-family: 'Bricolage'; font-weight: 800; src: url('fonts/BricolageGrotesque_800ExtraBold.ttf'); }
@font-face { font-family: 'Figtree'; font-weight: 600; src: url('fonts/Figtree_600SemiBold.ttf'); }
@font-face { font-family: 'Figtree'; font-weight: 700; src: url('fonts/Figtree_700Bold.ttf'); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #5A3FFF; }
#stage {
    position: relative; overflow: hidden;
    background:
        radial-gradient(ellipse 40% 55% at 50% 46%, rgba(255,255,255,.16), rgba(255,255,255,0) 70%),
        radial-gradient(circle at 6% 8%, rgba(255,255,255,.12), rgba(255,255,255,0) 30%),
        radial-gradient(circle at 96% 96%, rgba(30,10,120,.45), rgba(30,10,120,0) 40%),
        linear-gradient(135deg, #7058FF 0%, #5A3FFF 45%, #4326E8 100%);
}
.ring { position: absolute; border-radius: 50%; border: calc(var(--u) * .35) solid rgba(255,255,255,.10); transform: translate(-50%, -50%); }
.item { position: absolute; transform: translate(-50%, -50%) rotate(var(--r)); filter: drop-shadow(0 calc(var(--u) * 1.4) calc(var(--u) * 1.8) rgba(20, 8, 90, .35)); }
.spark { position: absolute; transform: translate(-50%, -50%); }
.card { background: #fff; border-radius: calc(var(--u) * 3.2); padding: calc(var(--u) * 2.2) calc(var(--u) * 2.6); font-family: 'Figtree'; color: #14141F; }
.badge { width: 100%; height: 100%; border-radius: 30%; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage'; font-weight: 800; }
.lbl { font-weight: 600; color: #5C5C70; }
.num { font-family: 'Bricolage'; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
.pill { display: inline-block; border-radius: 999px; font-weight: 700; }
#copy { position: absolute; left: 50%; transform: translate(-50%, -50%); text-align: center; white-space: nowrap; }
#h1 { color: #fff; font-family: 'Bricolage'; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; text-shadow: 0 .03em .08em rgba(20, 8, 90, .2); }
#h1 .hl { color: #FFC93C; }
#sub { color: rgba(255,255,255,.92); font-family: 'Figtree'; font-weight: 600; letter-spacing: -0.01em; margin-top: .55em; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const COPY = {
    it: ['Tutta la carriera', 'a colpo d’occhio', 'Media, CFU e voto di laurea con le regole del tuo corso', 'Media', 'e lode', 'Voto di laurea'],
    en: ['Your whole degree', 'at a glance', 'Average, credits and final grade with your course’s rules', 'Average', 'honours', 'Final grade'],
    es: ['Toda tu carrera', 'de un vistazo', 'Media, créditos y nota final con las reglas de tu carrera', 'Media', 'matrícula', 'Nota final'],
    fr: ['Tout ton cursus', 'en un coup d’œil', 'Moyenne, crédits et note finale selon ta filière', 'Moyenne', 'mention', 'Note finale'],
    de: ['Dein ganzes Studium', 'auf einen Blick', 'Schnitt, Credits und Abschlussnote nach deinem Studiengang', 'Schnitt', 'Auszeichnung', 'Abschlussnote'],
    pt: ['Todo o seu curso', 'num relance', 'Média, créditos e nota final com as regras do seu curso', 'Média', 'louvor', 'Nota final'],
};
const DECIMAL = { en: '.' };

// Canvas sizes accepted by App Store Connect for creative assets.
const FORMATS = {
    search: { w: 3840, h: 2560, font: 9.6, maxW: .46, copyY: 47 },
    header: { w: 3840, h: 1646, font: 13, maxW: .40, copyY: 45 },
};

const q = new URLSearchParams(location.search);
const lang = q.get('lang') || 'it';
const fmtName = q.get('fmt') || 'header';
const fmt = FORMATS[fmtName];
const [l1, l2, subText, avgWord, lodeWord, finalWord] = COPY[lang];
const dec = DECIMAL[lang] || ',';
const n = (s) => s.replace('.', dec);

// App elements re-drawn as artwork; sizes in units of 1% of the canvas height.
const ART = {
    mark: () => `<svg viewBox="170 180 720 690" width="100%" height="100%">
        <rect x="190" y="600" width="164" height="250" rx="46" fill="#FF6B57"/>
        <rect x="404" y="482" width="164" height="368" rx="46" fill="#FFC93C"/>
        <rect x="618" y="364" width="164" height="486" rx="46" fill="#3FD196"/>
        <g transform="translate(700 300) scale(0.86)">
            <path d="M-112 -10 L-112 50 C-112 84 -56 106 0 106 C56 106 112 84 112 50 L112 -10 L0 32 Z" fill="#14141F"/>
            <path d="M0 -112 L196 -40 L0 32 L-196 -40 Z" fill="#14141F"/>
            <path d="M0 -40 L140 -12 L140 70" stroke="#FFC93C" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="140" cy="86" r="24" fill="#FFC93C"/>
        </g></svg>`,
    avg: (u) => `<div class="card" style="width:100%">
        <div class="lbl" style="font-size:${2.3 * u}px">${avgWord}</div>
        <div class="num" style="font-size:${8.6 * u}px;margin:${0.6 * u}px 0 ${1.2 * u}px">${n('28.44')}</div>
        <span class="pill" style="font-size:${2.1 * u}px;padding:${0.6 * u}px ${1.4 * u}px;background:#D3F5E5;color:#0B6B45">▲ ${n('0.07')}</span></div>`,
    final: (u) => `<div class="card" style="width:100%;background:#14141F">
        <div class="lbl" style="font-size:${2.3 * u}px;color:#B9B8CC">${finalWord}</div>
        <div style="display:flex;align-items:flex-end;gap:${0.6 * u}px;margin-top:${0.6 * u}px">
            <span class="num" style="font-size:${8.6 * u}px;color:#FFC93C">110</span>
            <span class="num" style="font-size:${3 * u}px;color:#B9B8CC;margin-bottom:${0.9 * u}px">/110</span></div>
        <span class="pill" style="margin-top:${1.2 * u}px;font-size:${2.1 * u}px;padding:${0.6 * u}px ${1.4 * u}px;background:#FFC93C;color:#14141F">${lodeWord}</span></div>`,
    cfu: (u) => `<div class="card" style="width:100%">
        <div class="lbl" style="font-size:${2.3 * u}px">CFU</div>
        <div class="num" style="font-size:${6.6 * u}px;margin:${0.6 * u}px 0 ${1.4 * u}px">87<span style="font-size:${2.8 * u}px;color:#5C5C70">/180</span></div>
        <div style="height:${1.1 * u}px;border-radius:99px;background:#E9E8F2;overflow:hidden"><div style="width:48%;height:100%;background:#1FB57A;border-radius:99px"></div></div></div>`,
    chart: (u) => `<div class="card" style="width:100%;background:rgba(255,255,255,.14);display:flex;align-items:flex-end;gap:${0.9 * u}px;height:${17 * u}px">
        ${[62, 88, 74, 54, 80, 70, 92].map((h, i) => `<div style="flex:1;height:${h}%;border-radius:${0.9 * u}px ${0.9 * u}px ${0.4 * u}px ${0.4 * u}px;background:${i > 4 ? '#FFC93C' : 'rgba(255,255,255,.8)'}"></div>`).join('')}</div>`,
};
// Font follows the tile width so three-character grades (30L) never overflow.
const badge = (label, bg, fg) => (u, w) => `<div class="badge" style="background:${bg};color:${fg};font-size:${w * u * (label.length > 2 ? 0.4 : 0.52)}px">${label}</div>`;
Object.assign(ART, {
    b30L: badge('30L', '#14141F', '#FFC93C'),
    b29: badge('29', '#D3F5E5', '#0B6B45'),
    b28: badge('28', '#E6E1FF', '#3E25D9'),
    b26: badge('26', '#FFF1C7', '#7A5200'),
    b30: badge('30', '#FFFFFF', '#5A3FFF'),
});

// [art, x %, y %, width (units), height (units, 0 = auto), rotation]
const LAYOUT = {
    search: [
        ['avg', 13, 27, 27, 0, -6], ['b30L', 28, 10, 11, 11, 10], ['cfu', 12, 73, 25, 0, 5], ['b28', 3, 50, 10, 10, -12], ['b26', 30, 89, 9, 9, 8],
        ['mark', 50, 15, 12, 12, -3],
        ['final', 87, 27, 27, 0, 6], ['b29', 72, 10, 10, 10, -8], ['chart', 87, 74, 29, 0, -4], ['b30', 97, 51, 10, 10, 12], ['b28', 70, 89, 9, 9, -6],
    ],
    header: [
        ['avg', 12, 33, 34, 0, -6], ['b30L', 27, 13, 15, 15, 10], ['cfu', 11, 79, 31, 0, 5], ['b28', 2, 56, 12, 12, -12], ['b26', 27, 88, 12, 12, 8],
        ['mark', 22, 60, 13, 13, -4],
        ['final', 88, 32, 34, 0, 6], ['b29', 73, 13, 14, 14, -8], ['chart', 87, 80, 36, 0, -4], ['b30', 98, 56, 12, 12, 12], ['b28', 72, 90, 12, 12, -6],
    ],
};
const SPARKS = { search: [[38, 10, 2.6], [62, 82, 2.2], [60, 9, 1.8], [42, 88, 2.4], [96, 9, 2.6]], header: [[40, 10, 3.4], [62, 84, 2.6], [59, 9, 2.2], [42, 90, 2.8], [96, 9, 3.2]] };
const RINGS = { search: [[13, 27, 42], [87, 27, 44]], header: [[12, 33, 54], [88, 32, 58]] };

const stage = document.getElementById('stage');
stage.style.width = fmt.w + 'px';
stage.style.height = fmt.h + 'px';
const u = fmt.h / 100;
stage.style.setProperty('--u', u + 'px');
document.documentElement.lang = lang;

for (const [x, y, d] of RINGS[fmtName]) {
    const r = document.createElement('div');
    r.className = 'ring';
    Object.assign(r.style, { left: x + '%', top: y + '%', width: d * u + 'px', height: d * u + 'px' });
    stage.appendChild(r);
}
for (const [x, y, s] of SPARKS[fmtName]) {
    const el = document.createElement('div');
    el.className = 'spark';
    Object.assign(el.style, { left: x + '%', top: y + '%', width: s * u + 'px', height: s * u + 'px' });
    el.innerHTML = '<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 0 Q56 44 100 50 Q56 56 50 100 Q44 56 0 50 Q44 44 50 0 Z" fill="#fff" opacity=".9"/></svg>';
    stage.appendChild(el);
}
for (const [art, x, y, w, h, r] of LAYOUT[fmtName]) {
    const el = document.createElement('div');
    el.className = 'item';
    Object.assign(el.style, { left: x + '%', top: y + '%', width: w * u + 'px' });
    if (h) el.style.height = h * u + 'px';
    el.style.setProperty('--r', r + 'deg');
    el.innerHTML = ART[art](u, w);
    stage.appendChild(el);
}

const copy = document.createElement('div');
copy.id = 'copy';
copy.style.top = fmt.copyY + '%';
copy.innerHTML = `<div id="h1">${l1}<br><span class="hl">${l2}</span></div><div id="sub">${subText}</div>`;
stage.appendChild(copy);

// Shrink long headlines until they fit between the two clusters.
document.fonts.ready.then(() => {
    let size = fmt.font * u;
    const h1 = document.getElementById('h1');
    const sub = document.getElementById('sub');
    const apply = () => { h1.style.fontSize = size + 'px'; sub.style.fontSize = size * 0.3 + 'px'; };
    apply();
    while (copy.offsetWidth > fmt.w * fmt.maxW && size > 20) { size *= 0.97; apply(); }
    document.title = 'ready';
});
</script>
</body>
</html>
